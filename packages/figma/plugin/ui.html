<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    body { font: 12px/1.4 Inter, system-ui, sans-serif; margin: 12px; color: #222; }
    h1 { font-size: 13px; margin: 0 0 4px; }
    p { margin: 0 0 8px; color: #555; }
    button { font: inherit; padding: 6px 10px; margin-right: 6px; border: 1px solid #ccc; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    #tabs button.on { background: #eef2ff; border-color: #6366f1; }
    #stats { margin: 8px 0; padding: 8px; background: #f3f4f6; border-radius: 6px; }
    #warn { margin: 0 0 8px; padding-left: 16px; color: #92400e; max-height: 110px; overflow: auto; }
    textarea { width: 100%; height: 260px; box-sizing: border-box; font: 11px/1.4 ui-monospace, monospace; }
    .hidden { display: none; }
</style>
</head>
<body>
    <h1>Windcraft: Figma to code</h1>
    <p id="hint">Select one or more frames. Everything happens in Figma on your computer; nothing is sent anywhere.</p>
    <div id="bar"><button class="primary" id="run">Convert selection</button><button id="copy" class="hidden">Copy HTML</button><button id="save" class="hidden">Download .html</button></div>
    <div id="tabs" style="margin-top:8px"></div>
    <div id="stats" class="hidden"></div>
    <ul id="warn" class="hidden"></ul>
    <textarea id="out" readonly class="hidden"></textarea>
    <p id="next" class="hidden">Paste it into Windcraft (Add component, or the code panel of a design), or save it with the MCP tool <code>save_design</code>.</p>
<script>
    const $ = (id) => document.getElementById(id);
    let pages = [], current = 0;
    const show = (i) => {
        current = i;
        const p = pages[i];
        $("out").value = p.html;
        $("stats").textContent = `${p.layers} layers: ${p.stats.flex} Auto Layout frames became flex boxes, ${p.stats.absolute} items placed at exact positions, ${p.stats.text} texts, ${p.stats.assets} vectors/pictures inlined. Size ${Math.round(p.size / 1024)} KB. Fonts: ${p.fonts.join(", ") || "none"} (a font that is not on Google Fonts falls back to a similar one).`;
        $("warn").innerHTML = p.warnings.map((w) => `<li>${w.replace(/</g, "&lt;")}</li>`).join("");
        $("warn").classList.toggle("hidden", !p.warnings.length);
        [...$("tabs").children].forEach((b, n) => b.classList.toggle("on", n === i));
    };
    $("run").onclick = () => { $("hint").textContent = "Converting…"; parent.postMessage({ pluginMessage: { type: "run" } }, "*"); };
    $("copy").onclick = () => { $("out").select(); document.execCommand("copy"); $("copy").textContent = "Copied"; setTimeout(() => ($("copy").textContent = "Copy HTML"), 1200); };
    $("save").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([pages[current].html], { type: "text/html" }));
        a.download = (pages[current].title || "design").replace(/[^\w-]+/g, "-") + ".html";
        a.click();
    };
    // the plugin sandbox has no canvas: it sends a picture here to be drawn at the size it is shown at and saved small (WebP keeps transparency)
    async function shrink({ id, bytes, width, height, cover, quality = 0.7, maxPixels = 900000 }) {
        let dataUri = null;
        try {
            const bitmap = await createImageBitmap(new Blob([bytes]));
            const k = Math.min(1, Math.sqrt(maxPixels / Math.max(1, width * height))); // big pictures are drawn smaller: the page stays under the 1 MB limit
            const w = Math.max(1, Math.round(width * k)), h = Math.max(1, Math.round(height * k));
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            const g = canvas.getContext("2d");
            const scale = cover ? Math.max(w / bitmap.width, h / bitmap.height) : 0;
            if (cover) g.drawImage(bitmap, (w - bitmap.width * scale) / 2, (h - bitmap.height * scale) / 2, bitmap.width * scale, bitmap.height * scale);
            else g.drawImage(bitmap, 0, 0, w, h);
            dataUri = canvas.toDataURL("image/webp", quality);
            if (!dataUri.startsWith("data:image/webp")) dataUri = canvas.toDataURL("image/png"); // a browser without WebP: PNG
        } catch (err) { dataUri = null; }
        parent.postMessage({ pluginMessage: { type: "compressed", id, dataUri } }, "*");
    }
    onmessage = (e) => {
        const m = e.data.pluginMessage;
        if (!m) return;
        if (m.type === "compress") return shrink(m);
        if (m.type === "empty") $("hint").textContent = "Select one or more frames, then press Convert.";
        if (m.type === "progress") $("hint").textContent = `Reading ${m.name}${m.count ? ` (${m.count} layers)` : ""}…`;
        if (m.type === "error") $("hint").textContent = "Something went wrong: " + m.message;
        if (m.type === "result") {
            pages = m.pages; $("hint").textContent = `Converted ${pages.length} ${pages.length === 1 ? "frame" : "frames"}.`;
            $("tabs").innerHTML = pages.map((p, i) => `<button data-i="${i}">${p.title.replace(/</g, "&lt;")}</button>`).join("");
            $("tabs").onclick = (ev) => { const b = ev.target.closest("button"); if (b) show(Number(b.dataset.i)); };
            ["copy", "save", "stats", "out", "next"].forEach((id) => $(id).classList.remove("hidden"));
            show(0);
        }
    };
</script>
</body>
</html>
